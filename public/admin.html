<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Ravishankar Insights - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
header{
  background:#111827;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:21px}
.container{
  max-width:1000px;
  margin:25px auto;
  padding:15px;
}
.card{
  background:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0001;
}
input,select,textarea,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:9px;
  border:1px solid #cbd5e1;
  font-size:16px;
}
textarea{
  min-height:220px;
  resize:vertical;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}
button:hover{opacity:.9}
.logout{
  width:auto;
  background:#dc2626;
  padding:10px 18px;
}
#dashboard{display:none}
#loginMessage,#uploadMessage,#articleMessage{
  font-weight:bold;
  margin-top:10px;
}
.article-btn{
  background:#16a34a;
}
</style>
</head>

<body>

<header>
  <h1>🚀 The Ravishankar Insights — Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>🔐 Admin Login</h2>

    <input id="username" placeholder="Admin Username">
    <input id="password" type="password" placeholder="Admin Password">

    <button onclick="loginAdmin()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">
      <h2>📊 Admin Dashboard</h2>
      <p>Welcome to The Ravishankar Insights Admin Panel.</p>
    </div>


    <!-- NEW ARTICLE -->
    <div class="card">
      <h2>📝 New Article</h2>

      <input
        id="articleTitle"
        type="text"
        placeholder="Article Title"
      >

      <select id="articleCategory">
        <option value="General">General</option>
        <option value="BA">BA</option>
        <option value="MA">MA</option>
        <option value="UPSC">UPSC</option>
        <option value="NET-JRF">NET-JRF</option>
        <option value="UPPCS">UPPCS</option>
        <option value="Railway">Railway</option>
        <option value="SSC">SSC</option>
        <option value="Banking">Banking</option>
        <option value="LLB">LLB</option>
      </select>

      <textarea
        id="articleText"
        placeholder="Article यहाँ लिखें..."
      ></textarea>

      <button class="article-btn" onclick="saveArticle()">
        🚀 Publish Article
      </button>

      <div id="articleMessage"></div>
    </div>


    <!-- PDF UPLOAD -->
    <div class="card">
      <h2>📄 Upload PDF</h2>

      <label>Section</label>

      <select id="section">
        <option value="ba">BA</option>
        <option value="ma">MA</option>
        <option value="upsc">UPSC</option>
        <option value="net-jrf">NET-JRF</option>
        <option value="uppcs">UPPCS</option>
        <option value="railway">Railway</option>
        <option value="ssc">SSC</option>
        <option value="banking">Banking</option>
      </select>

      <input
        type="file"
        id="pdfFile"
        accept=".pdf,application/pdf"
      >

      <button onclick="uploadPDF()">📤 Upload PDF</button>

      <div id="uploadMessage"></div>
    </div>

<!-- FILE MANAGER -->
    <div class="card">
      <h2>📂 Section File Manager</h2>

      <label>Select Section</label>

      <select id="manageSection">
        <option value="ba">BA</option>
        <option value="ma">MA</option>
        <option value="upsc">UPSC</option>
        <option value="net-jrf">NET-JRF</option>
        <option value="uppcs">UPPCS</option>
        <option value="railway">Railway</option>
        <option value="ssc">SSC</option>
        <option value="banking">Banking</option>
      </select>

      <button onclick="loadMaterials()">🔄 Load Files</button>

      <div id="materialsMessage"></div>
      <div id="materialsList"></div>
    </div>

  </div>

</div>


<script>

let token = localStorage.getItem("adminToken");


function showDashboard(){

  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";

}


if(token){
  showDashboard();
}


async function loginAdmin(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!username || !password){

    message.textContent =
      "Username और Password डालें।";

    return;
  }

  try{

    const response =
      await fetch("/api/admin/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          username,
          password
        })

      });

    const data =
      await response.json();

    if(data.success){

      localStorage.setItem(
        "adminToken",
        data.token
      );

      token=data.token;

      message.textContent =
        "Login successful ✅";

      showDashboard();

    }else{

      message.textContent =
        data.message || "Login failed";

    }

  }catch(error){

    message.textContent =
      "Server से connection नहीं हो पाया।";

  }

}


async function saveArticle(){

  const title =
    document.getElementById("articleTitle").value.trim();

  const category =
    document.getElementById("articleCategory").value;

  const article =
    document.getElementById("articleText").value.trim();

  const message =
    document.getElementById("articleMessage");

  if(!token){

    message.textContent =
      "❌ पहले Admin Login करें।";

    return;
  }

  if(!title || !article){

    message.textContent =
      "❌ Title और Article जरूरी है।";

    return;
  }

  message.textContent =
    "⏳ Article save हो रहा है...";

  try{

    const response =
      await fetch("/api/articles",{

        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },

        body:JSON.stringify({
          title,
          category,
          article
        })

      });

    const data =
      await response.json();

    if(data.success){

      message.textContent =
        "✅ Article successfully published!";

      document.getElementById("articleTitle").value="";
      document.getElementById("articleText").value="";

    }else{

      message.textContent =
        "❌ " + (data.message || "Article save नहीं हुआ।");

      if(response.status === 401){

        localStorage.removeItem("adminToken");
        token=null;

      }

    }

  }catch(error){

    message.textContent =
      "❌ Server से connection नहीं हो पाया।";

  }

}


async function uploadPDF(){

  const fileInput =
    document.getElementById("pdfFile");

  const section =
    document.getElementById("section").value;

  const message =
    document.getElementById("uploadMessage");

  if(!token){

    message.textContent =
      "❌ पहले Admin Login करें।";

    return;
  }

  if(!fileInput.files.length){

    message.textContent =
      "पहले PDF select करें।";

    return;

  }

  const formData =
    new FormData();

  formData.append(
    "section",
    section
  );

  formData.append(
    "file",
    fileInput.files[0]
  );

  try{

    const response =
      await fetch(
        "/api/admin/upload",
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + token
          },

          body:formData
        }
      );

    const data =
      await response.json();

    if(data.success){

      message.textContent =
        "✅ PDF successfully upload हो गई: " +
        data.file.name;

      fileInput.value="";

    }else{

      message.textContent =
        "❌ " + data.message;

    }

  }catch(error){

    message.textContent =
      "❌ Upload failed.";

  }

}



async function loadMaterials(){

  const section =
    document.getElementById("manageSection").value;

  const message =
    document.getElementById("materialsMessage");

  const list =
    document.getElementById("materialsList");

  if(!token){
    message.textContent = "❌ पहले Admin Login करें।";
    return;
  }

  message.textContent = "⏳ Files load हो रही हैं...";
  list.innerHTML = "";

  try{

    const response =
      await fetch("/api/materials/" + section);

    const data =
      await response.json();

    if(!data.success){
      message.textContent =
        "❌ " + (data.message || "Files load नहीं हुईं।");
      return;
    }

    if(!data.files || data.files.length === 0){
      message.textContent = "ℹ️ इस section में अभी कोई file नहीं है।";
      return;
    }

    message.textContent =
      "✅ " + data.files.length + " file मिलीं।";

    data.files.forEach(function(file){

      const box = document.createElement("div");

      box.style.cssText =
        "padding:12px;margin:8px 0;background:#f8fafc;" +
        "border:1px solid #cbd5e1;border-radius:10px;";

      const name = document.createElement("span");
      name.textContent = "📄 " + file.name;

      const button = document.createElement("button");

      button.textContent = "🗑️ Delete";
      button.style.background = "#dc2626";
      button.style.marginTop = "8px";

      button.onclick = function(){
        deleteMaterial(section, file.name);
      };

      box.appendChild(name);
      box.appendChild(button);

      list.appendChild(box);

    });

  }catch(error){

    console.error(error);

    message.textContent =
      "❌ Server से connection नहीं हो पाया।";

  }

}


async function deleteMaterial(section, filename){

  if(!token){
    alert("पहले Admin Login करें।");
    return;
  }

  if(!confirm(
    "क्या आप यह file delete करना चाहते हैं?\n\n" +
    filename
  )){
    return;
  }

  try{

    const response =
      await fetch("/api/admin/materials/" +
        encodeURIComponent(section) +
        "/" +
        encodeURIComponent(filename),{

          method:"DELETE",

          headers:{
            "Authorization":
              "Bearer " + token
          }

        });

    const data =
      await response.json();

    if(data.success){

      alert("✅ File delete हो गई।");

      loadMaterials();

    }else{

      alert(
        "❌ " +
        (data.message || "File delete नहीं हुई।")
      );

    }

  }catch(error){

    console.error(error);

    alert("❌ Server से connection नहीं हो पाया।");

  }

}


function logout(){

  localStorage.removeItem("adminToken");

  token=null;

  document.getElementById("dashboard").style.display="none";
  document.getElementById("login").style.display="block";

}

</script>

</body>
</html>
