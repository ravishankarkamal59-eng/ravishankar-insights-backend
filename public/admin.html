<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Ravishankar Insights - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
header{
  background:#111827;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:21px}
.container{
  max-width:1000px;
  margin:25px auto;
  padding:15px;
}
.card{
  background:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0001;
}
input,select,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:9px;
  border:1px solid #cbd5e1;
  font-size:16px;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}
button:hover{opacity:.9}
.logout{width:auto;background:#dc2626;padding:10px 18px}
#dashboard{display:none}
#message{font-weight:bold;margin-top:10px}
.hidden{display:none}
</style>
</head>

<body>

<header>
  <h1>🚀 The Ravishankar Insights — Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>🔐 Admin Login</h2>

    <input id="username" placeholder="Admin Username">
    <input id="password" type="password" placeholder="Admin Password">

    <button onclick="loginAdmin()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">
      <h2>📊 Admin Dashboard</h2>
      <p>Welcome to The Ravishankar Insights Admin Panel.</p>
    </div>


    <!-- PDF UPLOAD -->
    <div class="card">
      <h2>📄 Upload PDF</h2>

      <label>Section</label>

      <select id="section">
        <option value="ba">BA</option>
        <option value="ma">MA</option>
        <option value="upsc">UPSC</option>
        <option value="net-jrf">NET-JRF</option>
        <option value="uppcs">UPPCS</option>
        <option value="railway">Railway</option>
        <option value="ssc">SSC</option>
        <option value="banking">Banking</option>
      </select>

      <input type="file" id="pdfFile" accept=".pdf,application/pdf">

      <button onclick="uploadPDF()">📤 Upload PDF</button>

      <div id="uploadMessage"></div>
    </div>

  </div>

</div>


<script>

let token = localStorage.getItem("adminToken");

function showDashboard(){

  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";

}

if(token){
  showDashboard();
}


async function loginAdmin(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!username || !password){

    message.textContent =
      "Username और Password डालें।";

    return;
  }

  try{

    const response =
      await fetch("/api/admin/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          username,
          password
        })

      });

    const data =
      await response.json();

    if(data.success){

      localStorage.setItem(
        "adminToken",
        data.token
      );

      token=data.token;

      message.textContent =
        "Login successful ✅";

      showDashboard();

    }else{

      message.textContent =
        data.message || "Login failed";

    }

  }catch(error){

    message.textContent =
      "Server से connection नहीं हो पाया।";

  }

}


async function uploadPDF(){

  const fileInput =
    document.getElementById("pdfFile");

  const section =
    document.getElementById("section").value;

  const message =
    document.getElementById("uploadMessage");

  if(!fileInput.files.length){

    message.textContent =
      "पहले PDF select करें।";

    return;

  }

  const formData =
    new FormData();

  formData.append(
    "section",
    section
  );

  formData.append(
    "file",
    fileInput.files[0]
  );

  try{

    const response =
      await fetch(
        "/api/admin/upload",
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + token
          },

          body:formData
        }
      );

    const data =
      await response.json();

    if(data.success){

      message.textContent =
        "✅ PDF successfully upload हो गई: " +
        data.file.name;

      fileInput.value="";

    }else{

      message.textContent =
        "❌ " + data.message;

    }

  }catch(error){

    message.textContent =
      "❌ Upload failed.";

  }

}


function logout(){

  localStorage.removeItem("adminToken");

  token=null;

  document.getElementById("dashboard").style.display="none";
  document.getElementById("login").style.display="block";

}

</script>

</body>
</html>
